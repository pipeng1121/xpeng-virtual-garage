<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Xpeng P7</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* 全局暗黑风格和防误触 */
    :root {
      --primary-purple: #9333ea;
      --card-bg: rgba(255, 255, 255, 0.06);
    }
    body {
      background-color: #0b0b0d; /* 纯正的深黑色背景 */
      color: white;
      margin: 0;
      padding: env(safe-area-inset-top) 20px 20px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    
    /* 顶部导航栏 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
    }
    header h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* 汽车展示区与紫色光效 */
    .car-showcase {
      position: relative;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }
    .car-image {
      width: 90%;
      z-index: 2;
      /* 暂用网络透明汽车占位图，后续可替换为你的真实 P7 图片 */
      content: url('https://cdn.pixabay.com/photo/2024/01/29/20/40/car-8540847_1280.png'); 
      filter: drop-shadow(0 20px 20px rgba(0,0,0,0.8));
    }
    .purple-glow {
      position: absolute;
      bottom: 20px;
      width: 70%;
      height: 20px;
      background: var(--primary-purple);
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.6;
      z-index: 1;
    }

    /* 核心数据区 (电量与续航) */
    .core-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      padding: 0 10px;
    }
    .stat-block { display: flex; flex-direction: column; }
    .stat-value { font-size: 32px; font-weight: 600; display: flex; align-items: baseline; gap: 5px; }
    .stat-label { font-size: 13px; color: #888; margin-top: 4px; }
    .battery-bar {
      width: 100px; height: 6px; background: rgba(255,255,255,0.1);
      border-radius: 3px; margin-top: 8px; overflow: hidden;
    }
    .battery-fill { width: 70%; height: 100%; background: var(--primary-purple); }

    /* 控制卡片网格 (毛玻璃质感) */
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.1s;
    }
    .card:active { transform: scale(0.96); } /* 点击缩放反馈 */
    .card-wide { grid-column: span 2; flex-direction: row; align-items: center; }
    
    .card-icon { font-size: 24px; margin-bottom: 10px; }
    .card-title { font-size: 16px; font-weight: 500; }
    .card-subtitle { font-size: 12px; color: #888; margin-top: 4px; }
    
    /* 音乐卡片特定样式 */
    .music-album { width: 40px; height: 40px; border-radius: 8px; background: orange; margin-right: 15px; }
    .music-controls { margin-left: auto; display: flex; gap: 15px; font-size: 18px; color: #ddd; }
  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <header>
    <div class="icon-btn">✕</div>
    <h1>Xpeng P7</h1>
    <div class="icon-btn">⚙</div>
  </header>

  <!-- 车辆模型与发光底座 -->
  <div class="car-showcase">
    <div class="purple-glow"></div>
    <img class="car-image" alt="Xpeng Car">
  </div>

  <!-- 电量与续航 -->
  <div class="core-stats">
    <div class="stat-block">
      <div class="stat-value">70% <span style="font-size: 14px; color:var(--primary-purple);">⚡</span></div>
      <div class="battery-bar"><div class="battery-fill" id="bat-level"></div></div>
      <div class="stat-label">Battery</div>
    </div>
    <div class="stat-block" style="align-items: flex-end;">
      <div class="stat-value">270 <span style="font-size: 16px; color: #888;">km</span></div>
      <div class="stat-label">Distance</div>
    </div>
  </div>

  <!-- 2x2 控制卡片网格 -->
  <div class="control-grid">
    <!-- 车门锁 -->
    <div class="card" id="door-btn" onclick="toggleDoor()">
      <div class="card-icon" id="door-icon">🔒</div>
      <div>
        <div class="card-title">Doors</div>
        <div class="card-subtitle" id="door-status">Locked</div>
      </div>
    </div>

    <!-- 空调温度 -->
    <div class="card" onclick="changeTemp()">
      <div class="card-icon" style="color: #4facfe;">❄️</div>
      <div>
        <div class="card-title">Climate control</div>
        <div class="card-value" style="font-size: 24px; font-weight: 600; margin-top: 5px;" id="temp-val">19.5°C</div>
      </div>
    </div>

    <!-- 速度/驾驶模式 -->
    <div class="card">
      <div class="card-icon" style="color: #bbb;">⏱️</div>
      <div>
        <div class="card-title">50 km/h</div>
        <div class="card-subtitle">Speed limit</div>
      </div>
    </div>

    <!-- 充电计划 -->
    <div class="card">
      <div class="card-icon" style="color: var(--primary-purple);">⚡</div>
      <div>
        <div class="card-title">Charging</div>
        <div class="card-subtitle">Scheduled at 02:00 AM</div>
      </div>
    </div>

    <!-- 音乐播放器 (横跨两列) -->
    <div class="card card-wide">
      <div class="music-album"></div>
      <div>
        <div class="card-title">Lost in yesterday</div>
        <div class="card-subtitle">Tame Impala</div>
      </div>
      <div class="music-controls">
        <span>⏮</span> <span>⏸</span> <span>⏭</span>
      </div>
    </div>
  </div>

  <script>
    // 简单的交互逻辑
    let isLocked = true;
    function toggleDoor() {
      isLocked = !isLocked;
      document.getElementById('door-icon').innerText = isLocked ? '🔒' : '🔓';
      document.getElementById('door-status').innerText = isLocked ? 'Locked' : 'Unlocked';
      document.getElementById('door-status').style.color = isLocked ? '#888' : '#fff';
    }

    let temp = 19.5;
    function changeTemp() {
      temp = temp === 19.5 ? 20.0 : (temp === 20.0 ? 20.5 : 19.5);
      document.getElementById('temp-val').innerText = temp.toFixed(1) + '°C';
    }
  </script>

</body>
</html>
